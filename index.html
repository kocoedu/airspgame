<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 가위바위보 게임</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;800&display=swap');
    
    body {
      font-family: 'Pretendard', sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    }
    
    .font-jua {
      font-family: 'Jua', sans-serif;
    }

    /* Confetti Canvas overlay */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 relative text-slate-800">

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <div class="w-full max-w-2xl mx-auto flex flex-col items-center gap-6 my-auto">

    <!-- 1. Header Section -->
    <header class="text-center space-y-2 bg-white/80 backdrop-blur-md p-6 rounded-3xl shadow-xl w-full border border-white/50">
      <div class="flex items-center justify-center gap-3 text-4xl sm:text-5xl mb-2">
        <span class="animate-bounce inline-block" style="animation-delay: 0s;">✊</span>
        <span class="animate-bounce inline-block" style="animation-delay: 0.15s;">✌️</span>
        <span class="animate-bounce inline-block" style="animation-delay: 0.3s;">🖐️</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold font-jua text-indigo-600 tracking-wide">
        AI 가위바위보
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 font-medium">
        카메라에 손을 보여주세요! 5초마다 AI가 손을 인식하여 컴퓨터와 승부합니다.
      </p>
    </header>

    <!-- 2. Control Buttons -->
    <div class="flex items-center justify-center gap-4 w-full">
      <button id="btn-start" onclick="startGame()" 
        class="flex-1 max-w-[200px] bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-jua text-xl py-3 px-6 rounded-2xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-2">
        <i class="fa-solid fa-play"></i> 게임 시작
      </button>
      <button id="btn-stop" onclick="stopGame()" disabled
        class="flex-1 max-w-[200px] bg-rose-400 hover:bg-rose-500 active:scale-95 text-white font-jua text-xl py-3 px-6 rounded-2xl shadow-lg shadow-rose-100 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2">
        <i class="fa-solid fa-stop"></i> 게임 종료
      </button>
    </div>

    <!-- 3. Camera Display Section -->
    <div class="relative w-full aspect-video max-w-md bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 border-white flex items-center justify-center group">
      
      <!-- Live Video -->
      <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover -scale-x-100"></video>
      
      <!-- Video Placeholder -->
      <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-slate-800 gap-3 p-4 text-center">
        <div class="w-16 h-16 rounded-full bg-slate-700/50 flex items-center justify-center text-2xl">
          <i class="fa-solid fa-video-slash"></i>
        </div>
        <p class="font-jua text-lg text-slate-300">'게임 시작' 버튼을 눌러 카메라를 활성화하세요.</p>
      </div>

      <!-- 5-Second Countdown HUD -->
      <div id="countdown-hud" class="hidden absolute top-4 right-4 bg-slate-900/80 backdrop-blur-md text-white px-4 py-2 rounded-2xl border border-white/20 flex items-center gap-2 shadow-lg">
        <i class="fa-regular fa-clock text-amber-400 animate-spin"></i>
        <span class="text-xs font-semibold text-slate-300">다음 인식:</span>
        <span id="timer-text" class="font-jua text-xl text-amber-400 w-4 text-center">5</span>초
      </div>

      <!-- Scanning Indicator -->
      <div id="scan-bar" class="hidden absolute inset-x-0 h-1 bg-indigo-500 shadow-[0_0_15px_#6366f1] animate-pulse top-1/2"></div>
    </div>

    <!-- 4. Game Result Cards (Player vs Computer) -->
    <div class="w-full bg-white/90 backdrop-blur-md rounded-3xl p-5 shadow-xl border border-white/60 space-y-4">
      <div class="grid grid-cols-3 gap-2 text-center items-center">
        
        <!-- Player Choice -->
        <div class="flex flex-col items-center p-3 rounded-2xl bg-indigo-50/70 border border-indigo-100">
          <span class="text-xs font-bold text-indigo-500 uppercase tracking-wider mb-1">내 제스처 (AI)</span>
          <div id="player-icon" class="text-4xl my-1 transition-all">❓</div>
          <span id="player-label" class="font-jua text-lg text-indigo-900">대기 중</span>
        </div>

        <!-- Round Result Banner -->
        <div class="flex flex-col items-center justify-center">
          <span class="text-xs font-bold text-slate-400 mb-1">결과</span>
          <div id="round-result" class="font-jua text-2xl sm:text-3xl text-slate-600 transition-all">
            준비
          </div>
        </div>

        <!-- Computer Choice -->
        <div class="flex flex-col items-center p-3 rounded-2xl bg-amber-50/70 border border-amber-100">
          <span class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-1">컴퓨터 (랜덤)</span>
          <div id="computer-icon" class="text-4xl my-1 transition-all">❓</div>
          <span id="computer-label" class="font-jua text-lg text-amber-900">대기 중</span>
        </div>

      </div>

      <!-- 5. Scoreboard Row -->
      <div class="pt-3 border-t border-slate-100 flex items-center justify-around font-jua text-lg sm:text-xl text-slate-700">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
          <span>승: <strong id="score-win" class="text-emerald-600 text-2xl">0</strong></span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-slate-400"></span>
          <span>무승부: <strong id="score-draw" class="text-slate-600 text-2xl">0</strong></span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-rose-500"></span>
          <span>패: <strong id="score-loss" class="text-rose-600 text-2xl">0</strong></span>
        </div>
      </div>
    </div>

    <!-- System Status Log Bar -->
    <div class="w-full bg-slate-900 text-slate-300 font-mono text-xs p-3 rounded-2xl flex items-center justify-between shadow-inner">
      <div class="flex items-center gap-2 truncate">
        <span class="w-2 h-2 rounded-full bg-emerald-400 animate-ping"></span>
        <span id="status-text" class="truncate">시스템 준비 완료. '게임 시작'을 누르세요.</span>
      </div>
      <button onclick="resetScore()" class="text-slate-400 hover:text-white underline text-[11px] shrink-0 ml-2">점수 리셋</button>
    </div>

  </div>

  <!-- JavaScript Section -->
  <script>
    // Game State Variables
    let isGameRunning = false;
    let countdownValue = 5;
    let gameTimer = null;
    let countdownTimer = null;
    let mediaStream = null;

    let wins = 0;
    let draws = 0;
    let losses = 0;

    const GESTURES = {
      rock: { name: '바위', emoji: '✊' },
      paper: { name: '보', emoji: '🖐️' },
      scissors: { name: '가위', emoji: '✌️' },
      unknown: { name: '미인식', emoji: '❓' }
    };

    // DOM Elements
    const video = document.getElementById('webcam');
    const videoPlaceholder = document.getElementById('video-placeholder');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const countdownHud = document.getElementById('countdown-hud');
    const timerText = document.getElementById('timer-text');
    const statusText = document.getElementById('status-text');

    const playerIcon = document.getElementById('player-icon');
    const playerLabel = document.getElementById('player-label');
    const computerIcon = document.getElementById('computer-icon');
    const computerLabel = document.getElementById('computer-label');
    const roundResult = document.getElementById('round-result');

    const scoreWin = document.getElementById('score-win');
    const scoreDraw = document.getElementById('score-draw');
    const scoreLoss = document.getElementById('score-loss');

    // 1. Start Game Session
    async function startGame() {
      if (isGameRunning) return;

      updateStatus('📷 카메라 연결 요청 중...');
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
          audio: false
        });
        video.srcObject = mediaStream;
        videoPlaceholder.classList.add('hidden');
        
        isGameRunning = true;
        btnStart.disabled = true;
        btnStop.disabled = false;
        countdownHud.classList.remove('hidden');

        updateStatus('▶️ 게임 시작! 5초마다 인식이 진행됩니다.');
        
        // Reset Round Display
        resetRoundDisplay();

        // Start Countdown Loop
        startCountdown();

      } catch (error) {
        console.error('Camera Error:', error);
        updateStatus('❌ 카메라 연결 실패: 권한을 허용해 주세요.');
        alert('카메라 접근 권한이 필요합니다.');
      }
    }

    // 2. Stop Game Session
    function stopGame() {
      isGameRunning = false;
      btnStart.disabled = false;
      btnStop.disabled = true;
      countdownHud.classList.add('hidden');

      if (countdownTimer) clearInterval(countdownTimer);
      if (gameTimer) clearTimeout(gameTimer);

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      video.srcObject = null;
      videoPlaceholder.classList.remove('hidden');
      updateStatus('⏹️ 게임이 종료되었습니다.');
    }

    // 3. Countdown Loop (5 Seconds)
    function startCountdown() {
      if (!isGameRunning) return;

      countdownValue = 5;
      timerText.textContent = countdownValue;

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        if (!isGameRunning) {
          clearInterval(countdownTimer);
          return;
        }

        countdownValue--;
        timerText.textContent = countdownValue;

        if (countdownValue <= 0) {
          clearInterval(countdownTimer);
          processGameTurn();
        }
      }, 1000);
    }

    // 4. Process Game Turn (Capture -> Predict -> Compute Winner -> Loop)
    async function processGameTurn() {
      if (!isGameRunning) return;

      updateStatus('🔍 AI 분석 중...');
      const imageBase64 = captureCroppedFrame();

      try {
        const response = await fetch('/api/predict', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ image: imageBase64 })
        });

        const data = await response.json();
        
        let playerMove = 'unknown';
        if (data.success && data.topClass) {
          playerMove = data.topClass.toLowerCase();
        }

        // Evaluate Round
        evaluateRound(playerMove);

      } catch (err) {
        console.error('API Error:', err);
        updateStatus('⚠️ 인식 실패 (서버 오류)');
        evaluateRound('unknown');
      }

      // Restart countdown for next turn
      if (isGameRunning) {
        startCountdown();
      }
    }

    // Capture and Center-crop frame
    function captureCroppedFrame() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const minDim = Math.min(video.videoWidth || 640, video.videoHeight || 480);
      
      canvas.width = 400;
      canvas.height = 400;

      const sx = ((video.videoWidth || 640) - minDim) / 2;
      const sy = ((video.videoHeight || 480) - minDim) / 2;

      ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 400, 400);
      return canvas.toDataURL('image/jpeg', 0.8);
    }

    // 5. Evaluate Win / Loss / Draw
    function evaluateRound(playerMove) {
      const choices = ['rock', 'paper', 'scissors'];
      const computerMove = choices[Math.floor(Math.random() * choices.length)];

      const pInfo = GESTURES[playerMove] || GESTURES.unknown;
      const cInfo = GESTURES[computerMove];

      // Update Player UI
      playerIcon.textContent = pInfo.emoji;
      playerLabel.textContent = pInfo.name;

      // Update Computer UI
      computerIcon.textContent = cInfo.emoji;
      computerLabel.textContent = cInfo.name;

      if (playerMove === 'unknown') {
        roundResult.textContent = '손 안보임';
        roundResult.className = 'font-jua text-2xl sm:text-3xl text-slate-400';
        updateStatus('⚠️ 손 모양을 카메라 중앙에 맞춰주세요.');
        return;
      }

      // Game Logic
      if (playerMove === computerMove) {
        draws++;
        roundResult.textContent = '무승부!';
        roundResult.className = 'font-jua text-2xl sm:text-3xl text-slate-600 animate-pulse';
        updateStatus(`비겼습니다! (${pInfo.name} vs ${cInfo.name})`);
      } else if (
        (playerMove === 'rock' && computerMove === 'scissors') ||
        (playerMove === 'scissors' && computerMove === 'paper') ||
        (playerMove === 'paper' && computerMove === 'rock')
      ) {
        wins++;
        roundResult.textContent = '승리! 🎉';
        roundResult.className = 'font-jua text-2xl sm:text-3xl text-emerald-500 font-extrabold animate-bounce';
        updateStatus(`이겼습니다! (${pInfo.name} 이김 ${cInfo.name})`);
        
        // Trigger Confetti Graphic
        triggerConfetti();
      } else {
        losses++;
        roundResult.textContent = '패배 😭';
        roundResult.className = 'font-jua text-2xl sm:text-3xl text-rose-500 font-bold';
        updateStatus(`졌습니다! (${pInfo.name} 짐 ${cInfo.name})`);
      }

      // Update Scoreboard
      scoreWin.textContent = wins;
      scoreDraw.textContent = draws;
      scoreLoss.textContent = losses;
    }

    function resetRoundDisplay() {
      playerIcon.textContent = '❓';
      playerLabel.textContent = '대기 중';
      computerIcon.textContent = '❓';
      computerLabel.textContent = '대기 중';
      roundResult.textContent = '준비';
      roundResult.className = 'font-jua text-2xl sm:text-3xl text-slate-600';
    }

    function resetScore() {
      wins = 0;
      draws = 0;
      losses = 0;
      scoreWin.textContent = '0';
      scoreDraw.textContent = '0';
      scoreLoss.textContent = '0';
      resetRoundDisplay();
      updateStatus('점수가 초기화되었습니다.');
    }

    function updateStatus(msg) {
      statusText.textContent = msg;
    }

    // 6. Particle Confetti Animation
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function triggerConfetti() {
      const colors = ['#f43f5e', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6'];
      for (let i = 0; i < 80; i++) {
        confettiParticles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 14,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 8 + 4,
          life: 100
        });
      }
      if (confettiParticles.length <= 80) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      
      confettiParticles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3; // Gravity
        p.life -= 1.5;

        confettiCtx.fillStyle = p.color;
        confettiCtx.beginPath();
        confettiCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        confettiCtx.fill();

        if (p.life <= 0) {
          confettiParticles.splice(index, 1);
        }
      });

      if (confettiParticles.length > 0) {
        requestAnimationFrame(animateConfetti);
      }
    }
  </script>
</body>
</html>
