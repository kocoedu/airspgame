<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 가위바위보 게임</title>
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;800&display=swap');
    
    body {
      font-family: 'Pretendard', sans-serif;
      background: linear-gradient(135deg, #f0f9ff 0%, #e0f2fe 100%);
    }
    
    .font-jua {
      font-family: 'Jua', sans-serif;
    }

    /* Confetti Canvas overlay */
    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-4 sm:p-6 relative text-slate-800">

  <!-- Confetti Canvas -->
  <canvas id="confetti-canvas"></canvas>

  <div class="w-full max-w-2xl mx-auto flex flex-col items-center gap-5 my-auto">

    <!-- 1. Header Section -->
    <header class="text-center space-y-2 bg-white/80 backdrop-blur-md p-5 sm:p-6 rounded-3xl shadow-xl w-full border border-white/50">
      <div class="flex items-center justify-center gap-3 text-4xl sm:text-5xl mb-1">
        <span class="animate-bounce inline-block" style="animation-delay: 0s;">✊</span>
        <span class="animate-bounce inline-block" style="animation-delay: 0.15s;">✌️</span>
        <span class="animate-bounce inline-block" style="animation-delay: 0.3s;">🖐️</span>
      </div>
      <h1 class="text-3xl sm:text-4xl font-extrabold font-jua text-indigo-600 tracking-wide">
        AI 가위바위보
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 font-medium">
        카메라에 손을 보여주세요! 5초마다 AI가 손을 인식하여 컴퓨터와 승부합니다.
      </p>

      <!-- Mode Selector Badge -->
      <div class="pt-2 flex items-center justify-center gap-2">
        <span class="text-xs font-semibold text-slate-400">인식 모드:</span>
        <button id="mode-toggle-btn" onclick="toggleApiMode()" 
          class="text-xs font-bold px-3 py-1 rounded-full border transition-all bg-indigo-50 border-indigo-200 text-indigo-600 hover:bg-indigo-100">
          <i class="fa-solid fa-cloud"></i> Vercel API 모드
        </button>
      </div>
    </header>

    <!-- 2. Control Buttons -->
    <div class="flex items-center justify-center gap-4 w-full">
      <button id="btn-start" onclick="startGame()" 
        class="flex-1 max-w-[200px] bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-jua text-xl py-3 px-6 rounded-2xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-play"></i> 게임 시작
      </button>
      <button id="btn-stop" onclick="stopGame()" disabled
        class="flex-1 max-w-[200px] bg-rose-400 hover:bg-rose-500 active:scale-95 text-white font-jua text-xl py-3 px-6 rounded-2xl shadow-lg shadow-rose-100 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-stop"></i> 게임 종료
      </button>
    </div>

    <!-- 3. Camera Display Section -->
    <div class="relative w-full aspect-video max-w-md bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 border-white flex items-center justify-center group">
      
      <!-- Live Video -->
      <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover -scale-x-100"></video>
      
      <!-- Video Placeholder -->
      <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-slate-800 gap-3 p-4 text-center">
        <div class="w-16 h-16 rounded-full bg-slate-700/50 flex items-center justify-center text-2xl">
          <i class="fa-solid fa-video-slash"></i>
        </div>
        <p class="font-jua text-lg text-slate-300">'게임 시작' 버튼을 눌러 카메라를 활성화하세요.</p>
      </div>

      <!-- Recognition State & Countdown HUD Banner -->
      <div id="countdown-hud" class="hidden absolute top-4 inset-x-4 flex items-center justify-between bg-slate-900/85 backdrop-blur-md text-white px-4 py-2.5 rounded-2xl border border-white/20 shadow-lg">
        <div class="flex items-center gap-2">
          <span id="hud-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="hud-phase-text" class="font-jua text-sm sm:text-base text-amber-300">손 모양을 준비하세요!</span>
        </div>
        <div class="flex items-center gap-1.5 font-jua">
          <span id="timer-text" class="text-xl text-amber-400 w-5 text-center">5</span>
          <span class="text-xs text-slate-300">초 후 인식</span>
        </div>
      </div>

      <!-- Center Scanning Target Overlay -->
      <div id="scan-target" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-48 h-48 border-2 border-dashed border-indigo-400/70 rounded-3xl animate-pulse flex items-center justify-center">
          <span class="text-xs text-indigo-300 bg-slate-900/60 px-2 py-1 rounded-md">손을 여기에 위치하세요</span>
        </div>
      </div>
    </div>

    <!-- 4. Game Result Cards (Player vs Computer) -->
    <div class="w-full bg-white/90 backdrop-blur-md rounded-3xl p-5 shadow-xl border border-white/60 space-y-4">
      <div class="grid grid-cols-3 gap-2 text-center items-center">
        
        <!-- Player Choice -->
        <div class="flex flex-col items-center p-3 rounded-2xl bg-indigo-50/70 border border-indigo-100">
          <span class="text-xs font-bold text-indigo-500 uppercase tracking-wider mb-1">내 제스처 (AI)</span>
          <div id="player-icon" class="text-4xl my-1 transition-all">❓</div>
          <span id="player-label" class="font-jua text-lg text-indigo-900">대기 중</span>
          <span id="player-conf" class="text-[11px] text-slate-400 font-medium">신뢰도: -</span>
        </div>

        <!-- Round Result Banner -->
        <div class="flex flex-col items-center justify-center">
          <span class="text-xs font-bold text-slate-400 mb-1">결과</span>
          <div id="round-result" class="font-jua text-2xl sm:text-3xl text-slate-600 transition-all">
            준비
          </div>
        </div>

        <!-- Computer Choice -->
        <div class="flex flex-col items-center p-3 rounded-2xl bg-amber-50/70 border border-amber-100">
          <span class="text-xs font-bold text-amber-600 uppercase tracking-wider mb-1">컴퓨터 (랜덤)</span>
          <div id="computer-icon" class="text-4xl my-1 transition-all">❓</div>
          <span id="computer-label" class="font-jua text-lg text-amber-900">대기 중</span>
          <span class="text-[11px] text-slate-400 font-medium">랜덤 선택</span>
        </div>

      </div>

      <!-- 5. Scoreboard Row -->
      <div class="pt-3 border-t border-slate-100 flex items-center justify-around font-jua text-lg sm:text-xl text-slate-700">
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-emerald-500"></span>
          <span>승: <strong id="score-win" class="text-emerald-600 text-2xl">0</strong></span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-slate-400"></span>
          <span>무승부: <strong id="score-draw" class="text-slate-600 text-2xl">0</strong></span>
        </div>
        <div class="flex items-center gap-2">
          <span class="w-3 h-3 rounded-full bg-rose-500"></span>
          <span>패: <strong id="score-loss" class="text-rose-600 text-2xl">0</strong></span>
        </div>
      </div>
    </div>

    <!-- System Status Log Bar -->
    <div class="w-full bg-slate-900 text-slate-300 font-mono text-xs p-3 rounded-2xl flex items-center justify-between shadow-inner">
      <div class="flex items-center gap-2 truncate">
        <span id="status-dot" class="w-2 h-2 rounded-full bg-emerald-400 animate-ping shrink-0"></span>
        <span id="status-text" class="truncate">시스템 준비 완료. '게임 시작'을 누르세요.</span>
      </div>
      <button onclick="resetScore()" class="text-slate-400 hover:text-white underline text-[11px] shrink-0 ml-2 cursor-pointer">점수 리셋</button>
    </div>

  </div>

  <script>
    // Application & Game State Variables
    let isGameRunning = false;
    let countdownValue = 5;
    let countdownTimer = null;
    let mediaStream = null;
    let useDemoMode = false; // Toggle between Vercel API and Demo Mode

    let wins = 0;
    let draws = 0;
    let losses = 0;

    const GESTURES = {
      rock: { name: '바위', emoji: '✊' },
      paper: { name: '보', emoji: '🖐️' },
      scissors: { name: '가위', emoji: '✌️' },
      unknown: { name: '미인식', emoji: '❓' }
    };

    // DOM Elements
    const video = document.getElementById('webcam');
    const videoPlaceholder = document.getElementById('video-placeholder');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const countdownHud = document.getElementById('countdown-hud');
    const scanTarget = document.getElementById('scan-target');
    const timerText = document.getElementById('timer-text');
    const hudPhaseText = document.getElementById('hud-phase-text');
    const hudDot = document.getElementById('hud-dot');
    const statusText = document.getElementById('status-text');
    const modeToggleBtn = document.getElementById('mode-toggle-btn');

    const playerIcon = document.getElementById('player-icon');
    const playerLabel = document.getElementById('player-label');
    const playerConf = document.getElementById('player-conf');
    const computerIcon = document.getElementById('computer-icon');
    const computerLabel = document.getElementById('computer-label');
    const roundResult = document.getElementById('round-result');

    const scoreWin = document.getElementById('score-win');
    scoreWin.textContent = '0';
    const scoreDraw = document.getElementById('score-draw');
    scoreDraw.textContent = '0';
    const scoreLoss = document.getElementById('score-loss');
    scoreLoss.textContent = '0';

    // 1. Toggle Mode Switcher
    function toggleApiMode() {
      useDemoMode = !useDemoMode;
      updateModeUI();
    }

    function updateModeUI() {
      if (useDemoMode) {
        modeToggleBtn.className = "text-xs font-bold px-3 py-1 rounded-full border transition-all bg-amber-50 border-amber-200 text-amber-600 hover:bg-amber-100 cursor-pointer";
        modeToggleBtn.innerHTML = '<i class="fa-solid fa-flask"></i> 체험(Demo) 모드';
        updateStatus('💡 체험 모드로 변경되었습니다 (로컬 무작위 인식 시뮬레이션).');
      } else {
        modeToggleBtn.className = "text-xs font-bold px-3 py-1 rounded-full border transition-all bg-indigo-50 border-indigo-200 text-indigo-600 hover:bg-indigo-100 cursor-pointer";
        modeToggleBtn.innerHTML = '<i class="fa-solid fa-cloud"></i> Vercel API 모드';
        updateStatus('🌐 Vercel Backend (/api/predict) API 모드로 설정되었습니다.');
      }
    }

    // 2. Start Game Session
    async function startGame() {
      if (isGameRunning) return;

      updateStatus('📷 카메라 연결 요청 중...');
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
          audio: false
        });
        video.srcObject = mediaStream;
        videoPlaceholder.classList.add('hidden');
        scanTarget.classList.remove('hidden');
        
        isGameRunning = true;
        btnStart.disabled = true;
        btnStop.disabled = false;
        countdownHud.classList.remove('hidden');

        updateStatus('▶️ 게임 시작! 5초마다 AI 인식이 진행됩니다.');
        
        // Reset Round Display
        resetRoundDisplay();

        // Start Countdown Loop
        startCountdown();

      } catch (error) {
        console.error('Camera Error:', error);
        updateStatus('❌ 카메라 연결 실패: 권한을 허용해 주세요.');
        alert('카메라 접근 권한이 필요합니다.');
      }
    }

    // 3. Stop Game Session
    function stopGame() {
      isGameRunning = false;
      btnStart.disabled = false;
      btnStop.disabled = true;
      countdownHud.classList.add('hidden');
      scanTarget.classList.add('hidden');

      if (countdownTimer) clearInterval(countdownTimer);

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      video.srcObject = null;
      videoPlaceholder.classList.remove('hidden');
      updateStatus('⏹️ 게임이 종료되었습니다.');
    }

    // 4. Countdown Loop (5 Seconds)
    function startCountdown() {
      if (!isGameRunning) return;

      countdownValue = 5;
      timerText.textContent = countdownValue;
      hudPhaseText.textContent = "다음 인식 대기 중...";
      hudDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        if (!isGameRunning) {
          clearInterval(countdownTimer);
          return;
        }

        countdownValue--;
        timerText.textContent = countdownValue;

        if (countdownValue === 1) {
          hudPhaseText.textContent = "손 모양을 유지하세요!";
          hudDot.className = "w-2.5 h-2.5 rounded-full bg-rose-400 animate-ping";
        }

        if (countdownValue <= 0) {
          clearInterval(countdownTimer);
          processGameTurn();
        }
      }, 1000);
    }

    // 5. Process Game Turn
    async function processGameTurn() {
      if (!isGameRunning) return;

      hudPhaseText.textContent = "📸 손 모양 인식 중...";
      hudDot.className = "w-2.5 h-2.5 rounded-full bg-indigo-400 animate-spin";
      updateStatus('🔍 카메라 화면 캡처 및 AI 인식 진행 중...');
      
      const imageBase64 = captureCroppedFrame();

      let detectedMove = 'unknown';
      let confidenceScore = 0.0;

      if (useDemoMode) {
        // Simulated Demo recognition for preview environment
        const moves = ['rock', 'paper', 'scissors', 'rock', 'paper', 'scissors'];
        detectedMove = moves[Math.floor(Math.random() * moves.length)];
        confidenceScore = Math.random() * 0.25 + 0.72; // 72% ~ 97%
        
        // Brief pause to simulate network scan
        await new Promise(r => setTimeout(r, 600));
        evaluateRound(detectedMove, confidenceScore);
      } else {
        // Production Vercel API Call with Safely Formatted URL
        try {
          let apiUrl = '/api/predict';
          if (window.location.protocol.startsWith('http')) {
            apiUrl = new URL('/api/predict', window.location.origin).href;
          }

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: imageBase64 })
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          
          if (data.success && data.topClass) {
            detectedMove = data.topClass.toLowerCase();
            confidenceScore = data.confidence || 0.0;
          }

          evaluateRound(detectedMove, confidenceScore);

        } catch (err) {
          console.warn('Vercel API connection failed or running in preview mode:', err);
          updateStatus('⚠️ Vercel API 서버에 연결할 수 없어 체험 모드로 자동 전환되었습니다.');
          
          useDemoMode = true;
          updateModeUI();

          const moves = ['rock', 'paper', 'scissors'];
          detectedMove = moves[Math.floor(Math.random() * moves.length)];
          confidenceScore = Math.random() * 0.25 + 0.75;
          evaluateRound(detectedMove, confidenceScore);
        }
      }

      // Restart countdown for next turn if game is active
      if (isGameRunning) {
        // Brief result display pause before restarting countdown
        setTimeout(() => {
          if (isGameRunning) startCountdown();
        }, 1200);
      }
    }

    // Capture and Center-crop video frame
    function captureCroppedFrame() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const minDim = Math.min(video.videoWidth || 640, video.videoHeight || 480);
      
      canvas.width = 400;
      canvas.height = 400;

      const sx = ((video.videoWidth || 640) - minDim) / 2;
      const sy = ((video.videoHeight || 480) - minDim) / 2;

      ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 400, 400);
      return canvas.toDataURL('image/jpeg', 0.85);
    }

    // 6. Evaluate Win / Loss / Draw Logic
    function evaluateRound(playerMove, confidence) {
      const choices = ['rock', 'paper', 'scissors'];
      const computerMove = choices[Math.floor(Math.random() * choices.length)];

      const pInfo = GESTURES[playerMove] || GESTURES.unknown;
      const cInfo = GESTURES[computerMove];

      // Update Player UI
      playerIcon.textContent = pInfo.emoji;
      playerLabel.textContent = pInfo.name;
      
      if (playerMove !== 'unknown' && confidence > 0) {
        playerConf.textContent = `신뢰도: ${(confidence * 100).toFixed(1)}%`;
      } else {
        playerConf.textContent = '신뢰도: -';
      }

      // Update Computer UI
      computerIcon.textContent = cInfo.emoji;
      computerLabel.textContent = cInfo.name;

      if (playerMove === 'unknown') {
        roundResult.textContent = '손 안보임';
        roundResult.className = 'font-jua text-2xl sm:text-3xl text-slate-400';
        updateStatus('⚠️ 손 모양이 감지되지 않았습니다. 손을 중앙에 위치해주세요.');
        return;
      }

      // Game Match Evaluation
      if (playerMove === computerMove) {
        draws++;
        roundResult.textContent = '무승부!';
        roundResult.className = 'font-jua text-2xl sm:text-3xl text-slate-600 animate-pulse';
        updateStatus(`비겼습니다! (${pInfo.name} vs ${cInfo.name})`);
      } else if (
        (playerMove === 'rock' && computerMove === 'scissors') ||
        (playerMove === 'scissors' && computerMove === 'paper') ||
        (playerMove === 'paper' && computerMove === 'rock')
      ) {
        wins++;
        roundResult.textContent = '승리! 🎉';
        roundResult.className = 'font-jua text-2xl sm:text-3xl text-emerald-500 font-extrabold animate-bounce';
        updateStatus(`이겼습니다! 🎉 (${pInfo.name} 이김 ${cInfo.name})`);
        
        // Trigger Confetti Graphic Explosion
        triggerConfetti();
      } else {
        losses++;
        roundResult.textContent = '패배 😭';
        roundResult.className = 'font-jua text-2xl sm:text-3xl text-rose-500 font-bold';
        updateStatus(`졌습니다! 😭 (${pInfo.name} 짐 ${cInfo.name})`);
      }

      // Update Scoreboard Text
      scoreWin.textContent = wins;
      scoreDraw.textContent = draws;
      scoreLoss.textContent = losses;
    }

    function resetRoundDisplay() {
      playerIcon.textContent = '❓';
      playerLabel.textContent = '대기 중';
      playerConf.textContent = '신뢰도: -';
      computerIcon.textContent = '❓';
      computerLabel.textContent = '대기 중';
      roundResult.textContent = '준비';
      roundResult.className = 'font-jua text-2xl sm:text-3xl text-slate-600';
    }

    function resetScore() {
      wins = 0;
      draws = 0;
      losses = 0;
      scoreWin.textContent = '0';
      scoreDraw.textContent = '0';
      scoreLoss.textContent = '0';
      resetRoundDisplay();
      updateStatus('점수가 초기화되었습니다.');
    }

    function updateStatus(msg) {
      statusText.textContent = msg;
    }

    // 7. Particle Confetti Celebration Graphics
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function triggerConfetti() {
      const colors = ['#f43f5e', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6', '#ec4899'];
      for (let i = 0; i < 90; i++) {
        confettiParticles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 14,
          vy: (Math.random() - 0.7) * 16,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 9 + 4,
          life: 100
        });
      }
      if (confettiParticles.length <= 90) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      
      confettiParticles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.35; // Gravity acceleration
        p.life -= 1.5;

        confettiCtx.fillStyle = p.color;
        confettiCtx.beginPath();
        confettiCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        confettiCtx.fill();

        if (p.life <= 0) {
          confettiParticles.splice(index, 1);
        }
      });

      if (confettiParticles.length > 0) {
        requestAnimationFrame(animateConfetti);
      }
    }
  </script>
</body>
</html>
