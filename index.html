<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI 가위바위보 게임 및 실시간 인식기</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;800&display=swap');
    
    body {
      font-family: 'Pretendard', sans-serif;
      background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
    }
    
    .font-jua {
      font-family: 'Jua', sans-serif;
    }

    #confetti-canvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      pointer-events: none;
      z-index: 99;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 relative text-slate-800">

  <canvas id="confetti-canvas"></canvas>

  <div class="w-full max-w-2xl mx-auto flex flex-col items-center gap-4 my-auto">

    <header class="text-center space-y-2 bg-white/90 backdrop-blur-md p-4 sm:p-5 rounded-3xl shadow-xl w-full border border-white/60">
      <div class="flex items-center justify-center gap-2 text-3xl sm:text-4xl mb-1">
        <span class="animate-bounce inline-block" style="animation-delay: 0s;">✊</span>
        <span class="animate-bounce inline-block" style="animation-delay: 0.15s;">✌️</span>
        <span class="animate-bounce inline-block" style="animation-delay: 0.3s;">🖐️</span>
      </div>
      <h1 class="text-2xl sm:text-3xl font-extrabold font-jua text-indigo-600 tracking-wide">
        AI 가위바위보 배틀 & 인식기
      </h1>
      <p class="text-xs sm:text-sm text-slate-500 font-medium">
        원활한 AI 인식률을 위해 조명이 밝은 곳에서 손을 중앙에 위치시켜 주세요!
      </p>

      <!-- Mode & Frequency Settings -->
      <div class="pt-2 flex flex-wrap items-center justify-center gap-3">
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-semibold text-slate-400">모드:</span>
          <button id="mode-toggle-btn" onclick="toggleApiMode()" 
            class="text-xs font-bold px-3 py-1 rounded-full border transition-all bg-indigo-50 border-indigo-200 text-indigo-600 hover:bg-indigo-100 cursor-pointer">
            <i class="fa-solid fa-cloud"></i> Vercel API
          </button>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="text-xs font-semibold text-slate-400">인식 주기:</span>
          <select id="interval-select" onchange="changeInterval(this.value)" class="text-xs font-bold px-2 py-1 rounded-xl border border-slate-200 bg-slate-50 text-slate-700 cursor-pointer outline-none">
            <option value="1500" selected>1.5초 (빠름/추천)</option>
            <option value="2500">2.5초 (안정적)</option>
            <option value="4000">4.0초 (여유)</option>
          </select>
        </div>
      </div>
    </header>

    <div class="flex items-center justify-center gap-3 w-full">
      <button id="btn-start" onclick="startGame()" 
        class="flex-1 max-w-[190px] bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-jua text-lg py-2.5 px-5 rounded-2xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-play"></i> 게임 시작
      </button>
      <button id="btn-stop" onclick="stopGame()" disabled
        class="flex-1 max-w-[190px] bg-rose-400 hover:bg-rose-500 active:scale-95 text-white font-jua text-lg py-2.5 px-5 rounded-2xl shadow-lg shadow-rose-100 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 cursor-pointer">
        <i class="fa-solid fa-stop"></i> 게임 종료
      </button>
    </div>

    <div class="relative w-full aspect-video max-w-md bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 border-white flex items-center justify-center group">
      
      <!-- Live Video Feed -->
      <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover -scale-x-100"></video>
      
      <!-- Placeholder when Camera is Idle -->
      <div id="video-placeholder" class="absolute inset-0 flex flex-col items-center justify-center text-slate-400 bg-slate-800 gap-3 p-4 text-center">
        <div class="w-14 h-14 rounded-full bg-slate-700/60 flex items-center justify-center text-2xl">
          <i class="fa-solid fa-video-slash"></i>
        </div>
        <p class="font-jua text-base text-slate-300">'게임 시작'을 눌러 카메라를 켜세요.</p>
      </div>

      <!-- Live Countdown & Status HUD Overlay -->
      <div id="countdown-hud" class="hidden absolute top-3 inset-x-3 flex items-center justify-between bg-slate-900/85 backdrop-blur-md text-white px-3.5 py-2 rounded-2xl border border-white/20 shadow-lg">
        <div class="flex items-center gap-2">
          <span id="hud-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-pulse"></span>
          <span id="hud-phase-text" class="font-jua text-xs sm:text-sm text-amber-300">손 모양 준비 중</span>
        </div>
        <div class="flex items-center gap-1 font-jua">
          <span id="timer-text" class="text-lg text-amber-400 w-4 text-center">3</span>
          <span class="text-[11px] text-slate-300">초</span>
        </div>
      </div>

      <!-- Center Square Scan Target -->
      <div id="scan-target" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
        <div class="w-40 h-40 border-2 border-dashed border-indigo-400/80 rounded-3xl animate-pulse flex items-center justify-center bg-indigo-500/5">
          <span class="text-[11px] font-semibold text-indigo-200 bg-slate-900/70 px-2.5 py-1 rounded-full shadow">중앙 사각형에 손 위치</span>
        </div>
      </div>
    </div>

    <div class="w-full bg-slate-900 text-slate-200 font-mono text-xs p-3 rounded-2xl flex items-center justify-between shadow-inner border border-slate-800">
      <div class="flex items-center gap-2.5 truncate">
        <span id="status-dot" class="w-2.5 h-2.5 rounded-full bg-emerald-400 animate-ping shrink-0"></span>
        <span id="status-text" class="truncate">시스템 준비 완료. '게임 시작' 버튼을 누르세요.</span>
      </div>
      <button onclick="resetScore()" class="text-slate-400 hover:text-white underline text-[11px] shrink-0 ml-2 cursor-pointer">점수 초기화</button>
    </div>

    <div class="w-full bg-white/90 backdrop-blur-md rounded-3xl p-4 sm:p-5 shadow-xl border border-white/60 space-y-4">
      <div class="grid grid-cols-3 gap-2 text-center items-center">
        
        <!-- Player Gesture Card -->
        <div class="flex flex-col items-center p-3 rounded-2xl bg-indigo-50/70 border border-indigo-100">
          <span class="text-[11px] font-bold text-indigo-500 uppercase tracking-wider mb-1">내 제스처 (AI)</span>
          <div id="player-icon" class="text-4xl my-1 transition-all">❓</div>
          <span id="player-label" class="font-jua text-base sm:text-lg text-indigo-900">대기 중</span>
          <span id="player-conf" class="text-[10px] text-slate-400 font-medium">신뢰도: -</span>
        </div>

        <!-- Round Result Banner -->
        <div class="flex flex-col items-center justify-center">
          <span class="text-[11px] font-bold text-slate-400 mb-1">승패 결과</span>
          <div id="round-result" class="font-jua text-xl sm:text-2xl text-slate-600 transition-all">
            대기
          </div>
        </div>

        <!-- Computer Gesture Card -->
        <div class="flex flex-col items-center p-3 rounded-2xl bg-amber-50/70 border border-amber-100">
          <span class="text-[11px] font-bold text-amber-600 uppercase tracking-wider mb-1">컴퓨터 (랜덤)</span>
          <div id="computer-icon" class="text-4xl my-1 transition-all">❓</div>
          <span id="computer-label" class="font-jua text-base sm:text-lg text-amber-900">대기 중</span>
          <span class="text-[10px] text-slate-400 font-medium">상대방</span>
        </div>

      </div>

      <!-- Scoreboard Row -->
      <div class="pt-3 border-t border-slate-100 flex items-center justify-around font-jua text-base sm:text-lg text-slate-700">
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
          <span>승: <strong id="score-win" class="text-emerald-600 text-xl sm:text-2xl">0</strong></span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
          <span>무: <strong id="score-draw" class="text-slate-600 text-xl sm:text-2xl">0</strong></span>
        </div>
        <div class="flex items-center gap-1.5">
          <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
          <span>패: <strong id="score-loss" class="text-rose-600 text-xl sm:text-2xl">0</strong></span>
        </div>
      </div>
    </div>

  </div>

  <script>
    // Game & State Management
    let isGameRunning = false;
    let detectionIntervalMs = 1500; // default 1.5s for snappy recognition
    let countdownValue = 3;
    let countdownTimer = null;
    let mediaStream = null;
    let useDemoMode = false;
    let isProcessingTurn = false;

    let wins = 0;
    let draws = 0;
    let losses = 0;

    const GESTURES = {
      rock: { name: '바위', emoji: '✊' },
      paper: { name: '보', emoji: '🖐️' },
      scissors: { name: '가위', emoji: '✌️' },
      unknown: { name: '미인식', emoji: '❓' }
    };

    // DOM Elements
    const video = document.getElementById('webcam');
    const videoPlaceholder = document.getElementById('video-placeholder');
    const btnStart = document.getElementById('btn-start');
    const btnStop = document.getElementById('btn-stop');
    const countdownHud = document.getElementById('countdown-hud');
    const scanTarget = document.getElementById('scan-target');
    const timerText = document.getElementById('timer-text');
    const hudPhaseText = document.getElementById('hud-phase-text');
    const hudDot = document.getElementById('hud-dot');
    const statusText = document.getElementById('status-text');
    const modeToggleBtn = document.getElementById('mode-toggle-btn');
    const intervalSelect = document.getElementById('interval-select');

    const playerIcon = document.getElementById('player-icon');
    const playerLabel = document.getElementById('player-label');
    const playerConf = document.getElementById('player-conf');
    const computerIcon = document.getElementById('computer-icon');
    const computerLabel = document.getElementById('computer-label');
    const roundResult = document.getElementById('round-result');

    const scoreWin = document.getElementById('score-win');
    const scoreDraw = document.getElementById('score-draw');
    const scoreLoss = document.getElementById('score-loss');

    function toggleApiMode() {
      useDemoMode = !useDemoMode;
      if (useDemoMode) {
        modeToggleBtn.className = "text-xs font-bold px-3 py-1 rounded-full border transition-all bg-amber-50 border-amber-200 text-amber-600 hover:bg-amber-100 cursor-pointer";
        modeToggleBtn.innerHTML = '<i class="fa-solid fa-flask"></i> 체험 모드';
        updateStatus('💡 체험 시뮬레이션 모드로 전환되었습니다.');
      } else {
        modeToggleBtn.className = "text-xs font-bold px-3 py-1 rounded-full border transition-all bg-indigo-50 border-indigo-200 text-indigo-600 hover:bg-indigo-100 cursor-pointer";
        modeToggleBtn.innerHTML = '<i class="fa-solid fa-cloud"></i> Vercel API';
        updateStatus('🌐 Vercel Backend (/api/predict) 모드로 설정되었습니다.');
      }
    }

    function changeInterval(val) {
      detectionIntervalMs = parseInt(val, 10);
      updateStatus(`⚙️ 인식 주기가 ${detectionIntervalMs / 1000}초로 변경되었습니다.`);
    }

    async function startGame() {
      if (isGameRunning) return;

      updateStatus('1/3단계: 카메라 권한 요청 및 스트림 연결 중...');
      try {
        mediaStream = await navigator.mediaDevices.getUserMedia({
          video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' },
          audio: false
        });
        video.srcObject = mediaStream;
        videoPlaceholder.classList.add('hidden');
        scanTarget.classList.remove('hidden');
        
        isGameRunning = true;
        btnStart.disabled = true;
        btnStop.disabled = false;
        countdownHud.classList.remove('hidden');

        updateStatus('2/3단계: 카메라 활성화 완료. 손 모양 스캔을 시작합니다!');
        resetRoundDisplay();
        startCountdown();

      } catch (error) {
        console.error('Camera Error:', error);
        updateStatus('❌ 카메라 연결 실패: 브라우저 카메라 권한을 확인해주세요.');
        alert('카메라 접근 권한이 필요합니다.');
      }
    }

    function stopGame() {
      isGameRunning = false;
      isProcessingTurn = false;
      btnStart.disabled = false;
      btnStop.disabled = true;
      countdownHud.classList.add('hidden');
      scanTarget.classList.add('hidden');

      if (countdownTimer) clearInterval(countdownTimer);

      if (mediaStream) {
        mediaStream.getTracks().forEach(track => track.stop());
        mediaStream = null;
      }

      video.srcObject = null;
      videoPlaceholder.classList.remove('hidden');
      updateStatus('⏹️ 게임이 종료되었습니다.');
    }

    function startCountdown() {
      if (!isGameRunning) return;

      const durationSec = Math.max(1, Math.round(detectionIntervalMs / 1000));
      countdownValue = durationSec;
      timerText.textContent = countdownValue;
      hudPhaseText.textContent = "손 모양을 중앙에 유지하세요";
      hudDot.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-pulse";

      if (countdownTimer) clearInterval(countdownTimer);

      countdownTimer = setInterval(() => {
        if (!isGameRunning) {
          clearInterval(countdownTimer);
          return;
        }

        countdownValue--;
        timerText.textContent = Math.max(0, countdownValue);

        if (countdownValue <= 0) {
          clearInterval(countdownTimer);
          processGameTurn();
        }
      }, 1000);
    }

    async function processGameTurn() {
      if (!isGameRunning || isProcessingTurn) return;
      isProcessingTurn = true;

      hudPhaseText.textContent = "3/3단계: AI 분류 모델 인식 중...";
      hudDot.className = "w-2.5 h-2.5 rounded-full bg-indigo-400 animate-spin";
      updateStatus('🔍 고해상도 프레임 캡처 및 AI 분류 모델 분석 중...');

      const imageBase64 = captureHighQualityFrame();

      let detectedMove = 'unknown';
      let confidenceScore = 0.0;

      if (useDemoMode) {
        const moves = ['rock', 'paper', 'scissors', 'rock', 'scissors'];
        detectedMove = moves[Math.floor(Math.random() * moves.length)];
        confidenceScore = Math.random() * 0.18 + 0.81; // 81% ~ 99%
        await new Promise(r => setTimeout(r, 300));
        evaluateRound(detectedMove, confidenceScore);
        isProcessingTurn = false;
        if (isGameRunning) startCountdown();
      } else {
        try {
          let apiUrl = '/api/predict';
          if (window.location.protocol.startsWith('http')) {
            apiUrl = new URL('/api/predict', window.location.origin).href;
          }

          const response = await fetch(apiUrl, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ image: imageBase64 })
          });

          if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
          }

          const data = await response.json();
          if (data.success && data.topClass) {
            detectedMove = data.topClass.toLowerCase();
            confidenceScore = data.confidence || 0.0;
          }

          evaluateRound(detectedMove, confidenceScore);

        } catch (err) {
          console.warn('API call fallback to simulation:', err);
          updateStatus('⚠️ Vercel API 응답 지연으로 임시 시뮬레이션 모드로 전환되었습니다.');
          
          const moves = ['rock', 'paper', 'scissors'];
          detectedMove = moves[Math.floor(Math.random() * moves.length)];
          confidenceScore = Math.random() * 0.2 + 0.8;
          evaluateRound(detectedMove, confidenceScore);
        } finally {
          isProcessingTurn = false;
          if (isGameRunning) startCountdown();
        }
      }
    }

    // Capture optimized center-cropped frame for high recognition accuracy
    function captureHighQualityFrame() {
      const canvas = document.createElement('canvas');
      const ctx = canvas.getContext('2d');
      const vw = video.videoWidth || 640;
      const vh = video.videoHeight || 480;
      const minDim = Math.min(vw, vh);

      canvas.width = 512;
      canvas.height = 512;

      const sx = (vw - minDim) / 2;
      const sy = (vh - minDim) / 2;

      ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 512, 512);
      return canvas.toDataURL('image/jpeg', 0.92);
    }

    function evaluateRound(playerMove, confidence) {
      const choices = ['rock', 'paper', 'scissors'];
      const computerMove = choices[Math.floor(Math.random() * choices.length)];

      const pInfo = GESTURES[playerMove] || GESTURES.unknown;
      const cInfo = GESTURES[computerMove];

      playerIcon.textContent = pInfo.emoji;
      playerLabel.textContent = pInfo.name;
      
      if (playerMove !== 'unknown' && confidence > 0) {
        playerConf.textContent = `신뢰도: ${(confidence * 100).toFixed(1)}%`;
      } else {
        playerConf.textContent = '신뢰도: -';
      }

      computerIcon.textContent = cInfo.emoji;
      computerLabel.textContent = cInfo.name;

      if (playerMove === 'unknown') {
        roundResult.textContent = '인식 실패';
        roundResult.className = 'font-jua text-xl sm:text-2xl text-slate-400';
        updateStatus('⚠️ 손 모양이 명확히 감지되지 않았습니다. 손을 사각형 안에 보여주세요.');
        return;
      }

      if (playerMove === computerMove) {
        draws++;
        roundResult.textContent = '무승부!';
        roundResult.className = 'font-jua text-xl sm:text-2xl text-slate-600';
        updateStatus(`무승부! 내 제스처: ${pInfo.name} vs 컴퓨터: ${cInfo.name}`);
      } else if (
        (playerMove === 'rock' && computerMove === 'scissors') ||
        (playerMove === 'scissors' && computerMove === 'paper') ||
        (playerMove === 'paper' && computerMove === 'rock')
      ) {
        wins++;
        roundResult.textContent = '승리! 🎉';
        roundResult.className = 'font-jua text-xl sm:text-2xl text-emerald-500 font-extrabold animate-bounce';
        updateStatus(`승리! 🎉 내 제스처(${pInfo.name})가 컴퓨터(${cInfo.name})를 이겼습니다!`);
        triggerConfetti();
      } else {
        losses++;
        roundResult.textContent = '패배 😭';
        roundResult.className = 'font-jua text-xl sm:text-2xl text-rose-500 font-bold';
        updateStatus(`패배 😭 내 제스처(${pInfo.name})가 컴퓨터(${cInfo.name})에게 졌습니다.`);
      }

      scoreWin.textContent = wins;
      scoreDraw.textContent = draws;
      scoreLoss.textContent = losses;
    }

    function resetRoundDisplay() {
      playerIcon.textContent = '❓';
      playerLabel.textContent = '대기 중';
      playerConf.textContent = '신뢰도: -';
      computerIcon.textContent = '❓';
      computerLabel.textContent = '대기 중';
      roundResult.textContent = '대기';
      roundResult.className = 'font-jua text-xl sm:text-2xl text-slate-600';
    }

    function resetScore() {
      wins = 0;
      draws = 0;
      losses = 0;
      scoreWin.textContent = '0';
      scoreDraw.textContent = '0';
      scoreLoss.textContent = '0';
      resetRoundDisplay();
      updateStatus('스코어가 초기화되었습니다.');
    }

    function updateStatus(msg) {
      statusText.textContent = msg;
    }

    // Confetti Fireworks Celebration
    const confettiCanvas = document.getElementById('confetti-canvas');
    const confettiCtx = confettiCanvas.getContext('2d');
    let confettiParticles = [];

    function resizeConfetti() {
      confettiCanvas.width = window.innerWidth;
      confettiCanvas.height = window.innerHeight;
    }
    window.addEventListener('resize', resizeConfetti);
    resizeConfetti();

    function triggerConfetti() {
      const colors = ['#f43f5e', '#10b981', '#3b82f6', '#f59e0b', '#8b5cf6'];
      for (let i = 0; i < 70; i++) {
        confettiParticles.push({
          x: window.innerWidth / 2,
          y: window.innerHeight / 2,
          vx: (Math.random() - 0.5) * 12,
          vy: (Math.random() - 0.7) * 14,
          color: colors[Math.floor(Math.random() * colors.length)],
          size: Math.random() * 8 + 4,
          life: 90
        });
      }
      if (confettiParticles.length <= 70) {
        animateConfetti();
      }
    }

    function animateConfetti() {
      confettiCtx.clearRect(0, 0, confettiCanvas.width, confettiCanvas.height);
      
      confettiParticles.forEach((p, index) => {
        p.x += p.vx;
        p.y += p.vy;
        p.vy += 0.3;
        p.life -= 1.5;

        confettiCtx.fillStyle = p.color;
        confettiCtx.beginPath();
        confettiCtx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        confettiCtx.fill();

        if (p.life <= 0) {
          confettiParticles.splice(index, 1);
        }
      });

      if (confettiParticles.length > 0) {
        requestAnimationFrame(animateConfetti);
      }
    }
  </script>
</body>
</html>
