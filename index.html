<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 가위바위보 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', sans-serif;
            background: linear-gradient(135deg, #f3e8ff 0%, #e0f2fe 50%, #fef3c7 100%);
            min-height: 100vh;
        }
        /* 거울 모드 (좌우 반전) */
        .mirror {
            transform: scaleX(-1);
        }
        /* 화면 흔들림 애니메이션 (패배 시) */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-8px); }
            40%, 80% { transform: translateX(8px); }
        }
        .animate-shake {
            animation: shake 0.4s ease-in-out;
        }
    </style>
</head>
<body class="text-slate-700 flex flex-col items-center justify-between p-4 md:p-6">

    <!-- 폭죽 효과를 위한 캔버스 -->
    <canvas id="confetti-canvas" class="fixed inset-0 pointer-events-none z-50 w-full h-full hidden"></canvas>

    <div class="w-full max-w-4xl mx-auto flex flex-col items-center space-y-6">

        <!-- ① 화면 상단 — 게임 제목 및 제스처 아이콘 -->
        <header class="text-center space-y-2 mt-2">
            <h1 class="text-3xl md:text-4xl font-extrabold text-indigo-700 drop-shadow-sm flex items-center justify-center gap-2">
                <span>🤖</span> AI 가위바위보 대결 <span>🎮</span>
            </h1>
            <div class="flex justify-center gap-4 text-3xl md:text-4xl py-1">
                <span class="animate-bounce" style="animation-delay: 0s;">✊</span>
                <span class="animate-bounce" style="animation-delay: 0.2s;">🖐</span>
                <span class="animate-bounce" style="animation-delay: 0.4s;">✌</span>
            </div>
            <p class="text-sm md:text-base text-slate-500">웹캠을 향해 손 모양을 보여주세요! 컴퓨터와의 짜릿한 승부!</p>
        </header>

        <!-- ② 게임 제어 버튼 -->
        <div class="flex flex-wrap justify-center gap-4 w-full">
            <button id="start-btn" onclick="startGame()" class="px-6 py-3 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-bold rounded-2xl shadow-lg transition duration-200 flex items-center gap-2 text-lg">
                <span>▶</span> 게임 시작
            </button>
            <button id="stop-btn" onclick="stopGame()" disabled class="px-6 py-3 bg-rose-400 hover:bg-rose-500 active:scale-95 text-white font-bold rounded-2xl shadow-lg transition duration-200 opacity-50 cursor-not-allowed flex items-center gap-2 text-lg">
                <span>■</span> 게임 종료
            </button>
        </div>

        <!-- ③ 중앙 — 실시간 카메라 화면 및 상태 -->
        <main class="w-full grid grid-cols-1 md:grid-cols-1 gap-6 items-center">
            <div class="relative w-full max-w-xl mx-auto bg-slate-900 rounded-3xl overflow-hidden shadow-2xl border-4 border-white aspect-[4/3]">
                <!-- 웹캠 비디오 -->
                <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover mirror"></video>
                <!-- 분석용 숨겨진 캔버스 -->
                <canvas id="snapshot-canvas" class="hidden"></canvas>

                <!-- 우측 상단 AI 인식 결과 배지 -->
                <div class="absolute top-4 right-4 bg-white/90 backdrop-blur-md px-4 py-2 rounded-2xl shadow-md flex flex-col items-end border border-white/40">
                    <span class="text-xs font-semibold text-slate-400 uppercase tracking-wider">AI 인식 결과</span>
                    <div id="ai-live-badge" class="text-lg font-bold text-indigo-600 flex items-center gap-1">
                        <span>준비 중...</span>
                    </div>
                </div>

                <!-- 카메라 하단 타이머 및 상태 오버레이 -->
                <div id="status-overlay" class="absolute bottom-0 inset-x-0 bg-gradient-to-t from-black/80 via-black/40 to-transparent p-4 text-center text-white">
                    <p id="game-status-text" class="text-sm md:text-base font-medium">상단 '게임 시작' 버튼을 눌러주세요.</p>
                    <div id="countdown-display" class="text-3xl md:text-4xl font-black text-amber-300 mt-1"></div>
                </div>
            </div>
        </main>

        <!-- ④ 카메라 아래 — 대결 결과 카드 -->
        <section class="w-full max-w-xl bg-white/80 backdrop-blur-md p-5 rounded-3xl shadow-xl border border-white">
            <h2 class="text-center text-sm font-bold text-slate-400 uppercase tracking-wider mb-4">마지막 대결 결과</h2>
            <div class="grid grid-cols-3 gap-3 text-center">
                <!-- 내 제스처 -->
                <div class="bg-indigo-50/70 p-4 rounded-2xl border border-indigo-100 flex flex-col items-center justify-center">
                    <span class="text-xs font-semibold text-indigo-400 mb-1">내 제스처</span>
                    <span id="res-my-emoji" class="text-3xl md:text-4xl my-1">❓</span>
                    <span id="res-my-text" class="text-xs md:text-sm font-bold text-indigo-700">대기 중</span>
                </div>
                <!-- 컴퓨터 -->
                <div class="bg-amber-50/70 p-4 rounded-2xl border border-amber-100 flex flex-col items-center justify-center">
                    <span class="text-xs font-semibold text-amber-500 mb-1">컴퓨터</span>
                    <span id="res-com-emoji" class="text-3xl md:text-4xl my-1">🤖</span>
                    <span id="res-com-text" class="text-xs md:text-sm font-bold text-amber-700">대기 중</span>
                </div>
                <!-- 결과 -->
                <div id="res-outcome-box" class="bg-slate-100 p-4 rounded-2xl border border-slate-200 flex flex-col items-center justify-center transition-colors duration-300">
                    <span class="text-xs font-semibold text-slate-400 mb-1">결과</span>
                    <span id="res-outcome-emoji" class="text-3xl md:text-4xl my-1">⏳</span>
                    <span id="res-outcome-text" class="text-xs md:text-sm font-bold text-slate-600">대기 중</span>
                </div>
            </div>
        </section>

        <!-- ⑤ 하단 — 누적 승패 기록 -->
        <footer class="w-full max-w-xl bg-white/60 backdrop-blur-sm px-6 py-4 rounded-2xl shadow-md border border-white flex justify-around items-center text-sm md:text-base font-bold">
            <div class="text-emerald-600 flex items-center gap-1.5">
                <span>🏆 승:</span> <span id="stat-wins" class="text-lg">0</span>
            </div>
            <div class="text-amber-600 flex items-center gap-1.5">
                <span>🤝 무승부:</span> <span id="stat-draws" class="text-lg">0</span>
            </div>
            <div class="text-rose-600 flex items-center gap-1.5">
                <span>😢 패:</span> <span id="stat-losses" class="text-lg">0</span>
            </div>
        </footer>

    </div>

    <!-- 알림 모달 (alert 대체용) -->
    <div id="custom-modal" class="fixed inset-0 bg-black/50 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl p-6 max-w-sm w-full shadow-2xl text-center space-y-4">
            <div id="modal-icon" class="text-4xl">⚠️</div>
            <h3 id="modal-title" class="text-lg font-bold text-slate-800">알림</h3>
            <p id="modal-message" class="text-sm text-slate-600"></p>
            <button onclick="closeModal()" class="w-full py-3 bg-indigo-600 hover:bg-indigo-700 text-white font-bold rounded-2xl transition">확인</button>
        </div>
    </div>

    <script>
        let videoElement = document.getElementById('webcam');
        let snapshotCanvas = document.getElementById('snapshot-canvas');
        let isGameRunning = false;
        let countdownTimer = null;
        let currentCountdown = 5;
        let isProcessing = false;

        // 누적 전적
        let stats = { wins: 0, draws: 0, losses: 0 };

        // 손 모양 매핑 데이터
        const gestureMap = {
            'rock': { text: '바위', emoji: '✊' },
            'paper': { text: '보', emoji: '🖐' },
            'scissors': { text: '가위', emoji: '✌' }
        };

        const computerChoices = [
            { key: 'rock', text: '바위', emoji: '✊' },
            { key: 'paper', text: '보', emoji: '🖐' },
            { key: 'scissors', text: '가위', emoji: '✌' }
        ];

        // 모달창 헬퍼
        function showModal(title, message, icon = '⚠️') {
            document.getElementById('modal-title').innerText = title;
            document.getElementById('modal-message').innerText = message;
            document.getElementById('modal-icon').innerText = icon;
            document.getElementById('custom-modal').classList.remove('hidden');
        }

        function closeModal() {
            document.getElementById('custom-modal').classList.add('hidden');
        }

        // 카메라 초기화
        async function initCamera() {
            try {
                const stream = await navigator.mediaDevices.getUserMedia({ 
                    video: { width: { ideal: 640 }, height: { ideal: 480 }, facingMode: 'user' } 
                });
                videoElement.srcObject = stream;
            } catch (error) {
                console.error("카메라 연결 실패:", error);
                showModal("카메라 오류", "카메라 연결에 실패했거나 권한이 거부되었습니다. 브라우저 설정 및 권한을 확인해주세요.", "📷");
                document.getElementById('game-status-text').innerText = "카메라 권한을 허용해주세요.";
            }
        }

        // 게임 시작
        function startGame() {
            if (isGameRunning) return;
            if (!videoElement.srcObject) {
                showModal("카메라 확인", "카메라가 연결되어 있지 않습니다. 권한을 허용해주세요.", "📷");
                initCamera();
                return;
            }

            isGameRunning = true;
            stats = { wins: 0, draws: 0, losses: 0 };
            updateStatsUI();

            document.getElementById('start-btn').disabled = true;
            document.getElementById('start-btn').classList.add('opacity-50', 'cursor-not-allowed');
            document.getElementById('stop-btn').disabled = false;
            document.getElementById('stop-btn').classList.remove('opacity-50', 'cursor-not-allowed');

            startNextRoundCountdown();
        }

        // 게임 종료
        function stopGame() {
            isGameRunning = false;
            if (countdownTimer) clearInterval(countdownTimer);
            isProcessing = false;

            document.getElementById('start-btn').disabled = false;
            document.getElementById('start-btn').classList.remove('opacity-50', 'cursor-not-allowed');
            document.getElementById('stop-btn').disabled = true;
            document.getElementById('stop-btn').classList.add('opacity-50', 'cursor-not-allowed');

            document.getElementById('game-status-text').innerText = "게임이 종료되었습니다.";
            document.getElementById('countdown-display').innerText = "";
            document.getElementById('ai-live-badge').innerHTML = `<span>대기 중</span>`;
        }

        // 5초 카운트다운 시작
        function startNextRoundCountdown() {
            if (!isGameRunning) return;

            currentCountdown = 5;
            document.getElementById('game-status-text').innerText = "다음 대결까지 남은 시간";
            document.getElementById('countdown-display').innerText = `${currentCountdown}초`;

            if (countdownTimer) clearInterval(countdownTimer);

            countdownTimer = setInterval(() => {
                if (!isGameRunning) {
                    clearInterval(countdownTimer);
                    return;
                }

                currentCountdown--;
                if (currentCountdown > 0) {
                    document.getElementById('countdown-display').innerText = `${currentCountdown}초`;
                } else {
                    clearInterval(countdownTimer);
                    document.getElementById('countdown-display').innerText = "찰칵! 📸";
                    executeBattleRound();
                }
            }, 1000);
        }

        // 대결 라운드 실행 (캡처 및 API 전송)
        async function executeBattleRound() {
            if (!isGameRunning || isProcessing) return;
            isProcessing = true;

            document.getElementById('game-status-text').innerText = "손 모양 분석 중...";

            try {
                // 1. 웹캠 화면 캡처
                const base64Image = captureWebcamFrame();
                if (!base64Image) {
                    throw new Error("카메라 캡처 실패");
                }

                // 2. 서버리스 API 호출 (/api/predict) 또는 캔버스 미리보기용 시뮬레이션 폴백
                const prediction = await callPredictionAPI(base64Image);

                if (!prediction || prediction.confidence < 0.6) {
                    document.getElementById('ai-live-badge').innerHTML = `<span class="text-rose-500 text-sm">인식률 저조 (60% 미만)</span>`;
                    document.getElementById('game-status-text').innerText = "손 모양을 정확하게 인식하지 못했습니다. 다시 시도합니다.";
                    setTimeout(() => {
                        if (isGameRunning) {
                            isProcessing = false;
                            startNextRoundCountdown();
                        }
                    }, 2000);
                    return;
                }

                // 우측 상단 라이브 배지 업데이트
                const myGestureKey = prediction.className; // rock, paper, scissors
                const confidencePct = Math.round(prediction.confidence * 100);
                const myInfo = gestureMap[myGestureKey] || { text: myGestureKey, emoji: '❓' };

                document.getElementById('ai-live-badge').innerHTML = `<span>${myInfo.emoji} ${myInfo.text}</span> <span class="text-xs text-slate-400 font-normal">(${confidencePct}%)</span>`;

                // 3. 컴퓨터 랜덤 선택
                const computerChoice = computerChoices[Math.floor(Math.random() * computerChoices.length)];

                // 4. 승패 판정
                const outcome = judgeOutcome(myGestureKey, computerChoice.key);

                // 5. 결과 UI 업데이트 및 효과
                updateResultUI(myInfo, computerChoice, outcome);

                // 6. 다음 대결 예약
                setTimeout(() => {
                    if (isGameRunning) {
                        isProcessing = false;
                        startNextRoundCountdown();
                    }
                }, 3000);

            } catch (error) {
                console.error("API 통신 오류:", error);
                document.getElementById('game-status-text').innerText = "API 통신 오류 발생. 다시 시도합니다.";
                setTimeout(() => {
                    if (isGameRunning) {
                        isProcessing = false;
                        startNextRoundCountdown();
                    }
                }, 2500);
            }
        }

        // 웹캠 프레임 캡처 함수
        function captureWebcamFrame() {
            if (!videoElement.videoWidth || !videoElement.videoHeight) return null;
            snapshotCanvas.width = videoElement.videoWidth;
            snapshotCanvas.height = videoElement.videoHeight;
            let ctx = snapshotCanvas.getContext('2d');
            // 거울 모드 반전 상태 원복하여 캡처
            ctx.save();
            ctx.scale(-1, 1);
            ctx.drawImage(videoElement, -snapshotCanvas.width, 0, snapshotCanvas.width, snapshotCanvas.height);
            ctx.restore();
            return snapshotCanvas.toDataURL('image/jpeg', 0.85);
        }

        // 예측 API 호출 (Vercel 서버리스 연동 + 캔버스 프리뷰용 시뮬레이터)
        async function callPredictionAPI(base64Image) {
            try {
                const response = await fetch('/api/predict', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ image: base64Image })
                });

                if (!response.ok) {
                    throw new Error("서버 응답 오류");
                }
                const data = await response.json();
                return {
                    className: data.className, // rock, paper, scissors 중 하나
                    confidence: data.confidence // 0.0 ~ 1.0
                };
            } catch (err) {
                // 참고: 캔버스 단독 실행 환경(서버리스 부재 시)을 위한 시뮬레이션 폴백
                console.warn("서버리스 API가 없어 시뮬레이션 모드로 동작합니다:", err);
                const mockKeys = ['rock', 'paper', 'scissors'];
                const randomKey = mockKeys[Math.floor(Math.random() * mockKeys.length)];
                return {
                    className: randomKey,
                    confidence: 0.85 + Math.random() * 0.14 // 85% ~ 99% 신뢰도
                };
            }
        }

        // 승패 판정 로직
        function judgeOutcome(myKey, comKey) {
            if (myKey === comKey) return 'draw';
            if (
                (myKey === 'rock' && comKey === 'scissors') ||
                (myKey === 'scissors' && comKey === 'paper') ||
                (myKey === 'paper' && comKey === 'rock')
            ) {
                return 'win';
            }
            return 'loss';
        }

        // 결과 UI 반영 및 효과 실행
        function updateResultUI(myInfo, comInfo, outcome) {
            document.getElementById('res-my-emoji').innerText = myInfo.emoji;
            document.getElementById('res-my-text').innerText = myInfo.text;

            document.getElementById('res-com-emoji').innerText = comInfo.emoji;
            document.getElementById('res-com-text').innerText = comInfo.text;

            const outcomeBox = document.getElementById('res-outcome-box');
            const outcomeEmoji = document.getElementById('res-outcome-emoji');
            const outcomeText = document.getElementById('res-outcome-text');

            outcomeBox.className = "p-4 rounded-2xl border flex flex-col items-center justify-center transition-colors duration-300";

            if (outcome === 'win') {
                stats.wins++;
                outcomeEmoji.innerText = "🎉";
                outcomeText.innerText = "승리!";
                outcomeBox.classList.add('bg-emerald-50', 'border-emerald-200', 'text-emerald-700');
                triggerConfetti();
                document.getElementById('game-status-text').innerText = "승리하셨습니다! 축하합니다 🎉";
            } else if (outcome === 'draw') {
                stats.draws++;
                outcomeEmoji.innerText = "🤝";
                outcomeText.innerText = "무승부";
                outcomeBox.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-700');
                document.getElementById('game-status-text').innerText = "무승부입니다! 🤝";
            } else {
                stats.losses++;
                outcomeEmoji.innerText = "😢";
                outcomeText.innerText = "패배";
                outcomeBox.classList.add('bg-rose-50', 'border-rose-200', 'text-rose-700');
                triggerShake();
                document.getElementById('game-status-text').innerText = "아쉽네요! 패배했습니다 😢";
            }

            updateStatsUI();
        }

        // 누적 전적 업데이트
        function updateStatsUI() {
            document.getElementById('stat-wins').innerText = stats.wins;
            document.getElementById('stat-draws').innerText = stats.draws;
            document.getElementById('stat-losses').innerText = stats.losses;
        }

        // 폭죽 효과 (Confetti)
        function triggerConfetti() {
            const canvas = document.getElementById('confetti-canvas');
            canvas.classList.remove('hidden');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            let particles = [];
            const colors = ['#f43f5e', '#3b82f6', '#10b981', '#f59e0b', '#8b5cf6'];

            for (let i = 0; i < 100; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.5) * 16 - 4,
                    size: Math.random() * 8 + 4,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    alpha: 1
                });
            }

            let startTime = Date.now();
            function animateConfetti() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                let elapsed = Date.now() - startTime;

                particles.forEach(p => {
                    p.x += p.vx;
                    p.y += p.vy;
                    p.vy += 0.4; // 중력
                    p.alpha = Math.max(0, 1 - elapsed / 2000);

                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.fillRect(p.x, p.y, p.size, p.size);
                    ctx.restore();
                });

                if (elapsed < 2000) {
                    requestAnimationFrame(animateConfetti);
                } else {
                    canvas.classList.add('hidden');
                }
            }
            animateConfetti();
        }

        // 화면 흔들림 효과 (패배 시)
        function triggerShake() {
            const mainBox = document.querySelector('main');
            mainBox.classList.add('animate-shake');
            setTimeout(() => {
                mainBox.classList.remove('animate-shake');
            }, 400);
        }

        // 페이지 로드시 카메라 초기화
        window.addEventListener('load', () => {
            initCamera();
        });
    </script>
</body>
</html>
