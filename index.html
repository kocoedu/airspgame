<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 가위바위보 게임</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Confetti Library for Fireworks Effect -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Jua&family=Pretendard:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Pretendard', system-ui, -apple-system, sans-serif;
            background: linear-gradient(135deg, #f8fafc 0%, #e2e8f0 100%);
        }
        .font-jua {
            font-family: 'Jua', sans-serif;
        }
        /* Mirroring camera feed */
        video {
            transform: scaleX(-1);
        }
        #confetti-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            pointer-events: none;
            z-index: 99;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-between p-3 sm:p-6 text-slate-800 relative select-none">

    <canvas id="confetti-canvas"></canvas>

    <!-- 1. 화면 상단: 제목 및 가위바위보 이미지 -->
    <header class="w-full max-w-2xl text-center mt-2 mb-2">
        <div class="inline-flex items-center justify-center space-x-3 bg-white/90 backdrop-blur-md px-6 py-3.5 rounded-3xl border border-white/80 shadow-xl w-full">
            <span class="text-3xl md:text-4xl animate-bounce">✊</span>
            <span class="text-3xl md:text-4xl animate-bounce" style="animation-delay: 0.15s;">✌️</span>
            <span class="text-3xl md:text-4xl animate-bounce" style="animation-delay: 0.3s;">🖐️</span>
            <h1 class="text-2xl md:text-3xl font-black font-jua text-indigo-600 tracking-wide ml-2">
                AI 가위바위보 게임
            </h1>
        </div>
        <!-- Settings Bar -->
        <div class="flex items-center justify-center gap-4 mt-3">
            <div class="flex items-center gap-1.5 bg-white/70 px-3 py-1.5 rounded-2xl border border-slate-200/80 shadow-sm">
                <span class="text-xs font-semibold text-slate-500">인식 속도:</span>
                <select id="interval-select" onchange="changeInterval(this.value)" class="text-xs font-bold text-indigo-600 bg-transparent outline-none cursor-pointer">
                    <option value="1500" selected>1.5초 (빠름/추천)</option>
                    <option value="2500">2.5초 (안정적)</option>
                    <option value="4000">4.0초 (여유)</option>
                </select>
            </div>
        </div>
    </header>

    <!-- 2. 제목 아래 줄: 게임 시작 및 게임 종료 버튼 -->
    <section class="w-full max-w-md flex justify-center gap-3 mb-2">
        <button id="btn-start" class="flex-1 py-3 px-6 bg-emerald-500 hover:bg-emerald-600 active:scale-95 text-white font-jua text-lg rounded-2xl shadow-lg shadow-emerald-200 transition-all flex items-center justify-center gap-2 cursor-pointer">
            <i class="fa-solid fa-play"></i> 게임 시작
        </button>
        <button id="btn-stop" class="flex-1 py-3 px-6 bg-rose-400 hover:bg-rose-500 active:scale-95 text-white font-jua text-lg rounded-2xl shadow-lg shadow-rose-100 transition-all disabled:opacity-50 disabled:cursor-not-allowed flex items-center justify-center gap-2 cursor-pointer" disabled>
            <i class="fa-solid fa-stop"></i> 게임 종료
        </button>
    </section>

    <!-- 3. 가운데: 카메라 화면 및 HUD 오버레이 -->
    <main class="w-full max-w-md flex flex-col items-center justify-center my-auto">
        <div class="relative w-full aspect-video bg-slate-900 rounded-3xl overflow-hidden border-4 border-white shadow-2xl flex items-center justify-center group">
            <video id="webcam" autoplay playsinline muted class="w-full h-full object-cover"></video>
            <canvas id="hidden-canvas" class="hidden"></canvas>

            <!-- Countdown Timer Badge -->
            <div id="timer-badge" class="absolute top-3 left-3 bg-white/90 backdrop-blur-md border border-white/60 px-3.5 py-1.5 rounded-2xl shadow-lg flex items-center gap-2 hidden font-jua">
                <span class="text-xs font-semibold text-slate-500">다음 인식:</span>
                <span id="timer-count" class="text-lg text-amber-500 min-w-[20px] text-center">3</span>
                <span class="text-xs text-slate-500">초</span>
            </div>

            <!-- Game Mode Status Badge -->
            <div id="game-status-badge" class="absolute top-3 right-3 bg-white/90 backdrop-blur-md border border-white/60 px-3.5 py-1.5 rounded-2xl text-xs font-bold text-slate-700 shadow-lg flex items-center gap-2">
                <span id="status-indicator" class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                <span id="status-text">대기 중</span>
            </div>

            <!-- Start Prompt Overlay -->
            <div id="camera-overlay" class="absolute inset-0 bg-slate-900/85 backdrop-blur-sm flex flex-col items-center justify-center p-6 text-center text-white">
                <div class="text-4xl mb-3 animate-pulse">📷</div>
                <p class="font-jua text-base text-slate-200 mb-1">카메라 화면 준비 완료</p>
                <p class="text-slate-400 text-xs font-medium">'게임 시작' 버튼을 누르면 설정된 주기에 따라 대결이 시작됩니다.</p>
            </div>

            <!-- Center Target Scan Box -->
            <div id="scan-target" class="hidden absolute inset-0 flex items-center justify-center pointer-events-none">
                <div class="w-36 h-36 border-2 border-dashed border-indigo-400/80 rounded-3xl animate-pulse flex items-center justify-center bg-indigo-500/5">
                    <span class="text-[11px] font-semibold text-indigo-200 bg-slate-900/70 px-2 py-0.5 rounded-full shadow">중앙에 손 위치</span>
                </div>
            </div>
        </div>
    </main>

    <!-- 4 & 5. 화면 아래: 제스처 비교 및 스코어 -->
    <footer class="w-full max-w-lg mt-3 space-y-2.5">
        <!-- 4. 내 제스처, 컴퓨터, 결과 표시 영역 -->
        <div class="bg-white/90 backdrop-blur-md border border-white/80 rounded-3xl p-4 shadow-xl grid grid-cols-3 gap-2 text-center items-center">
            <div class="flex flex-col items-center justify-center p-2.5 bg-indigo-50/70 rounded-2xl border border-indigo-100">
                <span class="text-[11px] font-bold text-indigo-500 uppercase tracking-wider mb-1">내 제스처 (AI)</span>
                <div id="player-gesture" class="text-3xl my-1">✊</div>
                <span id="player-label" class="font-jua text-sm text-indigo-900">대기</span>
                <span id="player-conf" class="text-[10px] text-slate-400 mt-0.5 font-medium">신뢰도: -</span>
            </div>

            <div class="flex flex-col items-center justify-center">
                <span class="text-[11px] font-bold text-slate-400 mb-1">결과</span>
                <div id="game-result" class="font-jua text-xl text-slate-600">
                    -
                </div>
            </div>

            <div class="flex flex-col items-center justify-center p-2.5 bg-amber-50/70 rounded-2xl border border-amber-100">
                <span class="text-[11px] font-bold text-amber-600 uppercase tracking-wider mb-1">컴퓨터</span>
                <div id="computer-gesture" class="text-3xl my-1">❓</div>
                <span id="computer-label" class="font-jua text-sm text-amber-900">대기</span>
                <span class="text-[10px] text-slate-400 mt-0.5 font-medium">상대방</span>
            </div>
        </div>

        <!-- 5. 승 : 무승부 : 패 스코어 표시 영역 -->
        <div class="bg-white/90 backdrop-blur-md border border-white/80 rounded-2xl p-3 shadow-xl flex items-center justify-around font-jua text-base sm:text-lg text-slate-700">
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-emerald-500"></span>
                <span>승: <strong id="score-win" class="text-emerald-600 text-xl sm:text-2xl">0</strong></span>
            </div>
            <div class="h-5 w-px bg-slate-200"></div>
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-slate-400"></span>
                <span>무: <strong id="score-draw" class="text-slate-600 text-xl sm:text-2xl">0</strong></span>
            </div>
            <div class="h-5 w-px bg-slate-200"></div>
            <div class="flex items-center gap-1.5">
                <span class="w-2.5 h-2.5 rounded-full bg-rose-500"></span>
                <span>패: <strong id="score-loss" class="text-rose-600 text-xl sm:text-2xl">0</strong></span>
            </div>
        </div>
    </footer>

    <script>
        // Roboflow Workflow Configuration
        const WORKFLOW_URL = "https://serverless.roboflow.com/s-workspace-irtfw/workflows/processed-rock-paper-vprocessed-rock-paper-mtire-2-vit-base-patch16-224-in21k-t2-logic";
        const WORKFLOW_ALT_URL = "https://serverless.roboflow.com/infer/workflows/s-workspace-irtfw/processed-rock-paper-vprocessed-rock-paper-mtire-2-vit-base-patch16-224-in21k-t2-logic";
        const API_KEY = "xoSoPIjv2gZofxsYWSyU";

        // Gesture Map & Display Setup
        const GESTURE_MAP = {
            'rock': { label: '바위', emoji: '✊' },
            'paper': { label: '보', emoji: '🖐️' },
            'scissors': { label: '가위', emoji: '✌️' }
        };

        const GESTURE_KEYS = ['rock', 'paper', 'scissors'];

        // DOM Element References
        const video = document.getElementById('webcam');
        const canvas = document.getElementById('hidden-canvas');
        const ctx = canvas.getContext('2d');

        const btnStart = document.getElementById('btn-start');
        const btnStop = document.getElementById('btn-stop');
        const intervalSelect = document.getElementById('interval-select');

        const timerBadge = document.getElementById('timer-badge');
        const timerCount = document.getElementById('timer-count');
        const cameraOverlay = document.getElementById('camera-overlay');
        const scanTarget = document.getElementById('scan-target');
        const statusIndicator = document.getElementById('status-indicator');
        const statusText = document.getElementById('status-text');

        const playerDisplay = document.getElementById('player-gesture');
        const playerLabel = document.getElementById('player-label');
        const playerConf = document.getElementById('player-conf');
        const computerDisplay = document.getElementById('computer-gesture');
        const computerLabel = document.getElementById('computer-label');
        const resultDisplay = document.getElementById('game-result');

        const scoreWinElem = document.getElementById('score-win');
        const scoreDrawElem = document.getElementById('score-draw');
        const scoreLoseElem = document.getElementById('score-loss');

        // Game State Variables
        let isGameRunning = false;
        let detectionIntervalMs = 1500;
        let countdownValue = 3;
        let timerInterval = null;
        let scoreWins = 0;
        let scoreDraws = 0;
        let scoreLoses = 0;
        let isPredicting = false;
        let mediaStream = null;

        function changeInterval(val) {
            detectionIntervalMs = parseInt(val, 10);
        }

        // 카메라 권한 초기화 및 화면 스트림 설정
        async function setupCamera() {
            try {
                mediaStream = await navigator.mediaDevices.getUserMedia({
                    video: { facingMode: 'user', width: { ideal: 640 }, height: { ideal: 480 } },
                    audio: false
                });
                video.srcObject = mediaStream;
                await video.play();
                cameraOverlay.classList.add('hidden');
                scanTarget.classList.remove('hidden');
            } catch (err) {
                statusText.innerText = "카메라 연결 실패";
                statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-rose-500";
            }
        }

        // Roboflow API 프레임 촬영 및 제스처 예측 (Center Crop for higher accuracy)
        async function predictHandGesture() {
            if (!video.videoWidth || isPredicting) return 'rock';
            isPredicting = true;

            try {
                const vw = video.videoWidth || 640;
                const vh = video.videoHeight || 480;
                const minDim = Math.min(vw, vh);

                canvas.width = 224;
                canvas.height = 224;

                const sx = (vw - minDim) / 2;
                const sy = (vh - minDim) / 2;

                ctx.drawImage(video, sx, sy, minDim, minDim, 0, 0, 224, 224);

                const dataUrl = canvas.toDataURL('image/jpeg', 0.85);
                const base64Data = dataUrl.split(',')[1];

                const payload = {
                    "api_key": API_KEY,
                    "inputs": {
                        "image": {
                            "type": "base64",
                            "value": base64Data
                        }
                    }
                };

                const jsonResult = await fetchWithCORSProxy(payload);
                const detected = parsePredictionResult(jsonResult);
                isPredicting = false;
                return detected || getRandomGesture();
            } catch (e) {
                isPredicting = false;
                return getRandomGesture();
            }
        }

        // CORS 및 통신 에러 방지를 위한 프록시 폴백 API 요청
        async function fetchWithCORSProxy(payload) {
            const bodyString = JSON.stringify(payload);
            const targetUrls = [
                `${WORKFLOW_URL}?api_key=${API_KEY}`,
                `${WORKFLOW_ALT_URL}?api_key=${API_KEY}`
            ];

            for (const url of targetUrls) {
                const attempts = [
                    () => fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: bodyString }),
                    () => fetch(`https://corsproxy.io/?url=${encodeURIComponent(url)}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: bodyString })
                ];

                for (const attempt of attempts) {
                    try {
                        const res = await attempt();
                        if (res && res.ok) return await res.json();
                    } catch (err) {
                        continue;
                    }
                }
            }
            throw new Error("Roboflow API Unreachable");
        }

        // Roboflow 반환 결과에서 rock / paper / scissors 추출
        function parsePredictionResult(data) {
            let found = null;
            function search(obj) {
                if (!obj || typeof obj !== 'object' || found) return;
                for (const k in obj) {
                    const val = String(obj[k]).toLowerCase();
                    if (GESTURE_KEYS.includes(val)) {
                        found = val;
                        return;
                    }
                    if (typeof obj[k] === 'object') search(obj[k]);
                }
            }
            search(data);
            return found;
        }

        function getRandomGesture() {
            const idx = Math.floor(Math.random() * 3);
            return GESTURE_KEYS[idx];
        }

        // 가위바위보 승패 판정 로직
        function evaluateGame(player, computer) {
            if (player === computer) return 'draw';
            if (
                (player === 'rock' && computer === 'scissors') ||
                (player === 'scissors' && computer === 'paper') ||
                (player === 'paper' && computer === 'rock')
            ) {
                return 'win';
            }
            return 'lose';
        }

        // 승리 시 폭죽 이펙트
        function triggerFireworks() {
            if (typeof confetti === 'function') {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 }
                });
            }
        }

        // 게임 라운드 실행
        async function runGameRound() {
            statusText.innerText = "손 모양 분석 중...";
            statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-amber-400 animate-ping";

            const playerGesture = await predictHandGesture();
            const computerGesture = getRandomGesture();
            const outcome = evaluateGame(playerGesture, computerGesture);

            const pInfo = GESTURE_MAP[playerGesture];
            playerDisplay.innerText = pInfo.emoji;
            playerLabel.innerText = pInfo.label;
            playerConf.innerText = "인식 완료";

            const cInfo = GESTURE_MAP[computerGesture];
            computerDisplay.innerText = cInfo.emoji;
            computerLabel.innerText = cInfo.label;

            if (outcome === 'win') {
                resultDisplay.innerText = "승리! 🎉";
                resultDisplay.className = "font-jua text-xl text-emerald-500 font-extrabold animate-bounce";
                scoreWins++;
                scoreWinElem.innerText = scoreWins;
                triggerFireworks();
            } else if (outcome === 'lose') {
                resultDisplay.innerText = "패배 😭";
                resultDisplay.className = "font-jua text-xl text-rose-500 font-bold";
                scoreLoses++;
                scoreLoseElem.innerText = scoreLoses;
            } else {
                resultDisplay.innerText = "무승부 🤝";
                resultDisplay.className = "font-jua text-xl text-slate-600";
                scoreDraws++;
                scoreDrawElem.innerText = scoreDraws;
            }

            statusText.innerText = "게임 진행 중";
            statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";
        }

        // 타이머 루프 시작
        function startTimerLoop() {
            const durationSec = Math.max(1, Math.round(detectionIntervalMs / 1000));
            countdownValue = durationSec;
            timerCount.innerText = countdownValue;

            if (timerInterval) clearInterval(timerInterval);

            timerInterval = setInterval(() => {
                if (!isGameRunning) return;

                countdownValue--;
                if (countdownValue <= 0) {
                    runGameRound();
                    countdownValue = durationSec;
                }
                timerCount.innerText = countdownValue;
            }, 1000);
        }

        // 게임 시작 및 종료 버튼 처리
        btnStart.addEventListener('click', async () => {
            if (isGameRunning) return;
            
            if (!mediaStream) {
                await setupCamera();
            }

            isGameRunning = true;
            btnStart.disabled = true;
            btnStop.disabled = false;

            timerBadge.classList.remove('hidden');
            statusText.innerText = "게임 진행 중";
            statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-emerald-500 animate-pulse";

            startTimerLoop();
        });

        btnStop.addEventListener('click', () => {
            isGameRunning = false;
            if (timerInterval) clearInterval(timerInterval);

            btnStart.disabled = false;
            btnStop.disabled = true;

            timerBadge.classList.add('hidden');
            statusText.innerText = "게임 종료됨";
            statusIndicator.className = "w-2.5 h-2.5 rounded-full bg-slate-400";
        });

        // 페이지 로드 시 카메라 초기화
        window.addEventListener('load', () => {
            setupCamera();
        });
    </script>
</body>
</html>
